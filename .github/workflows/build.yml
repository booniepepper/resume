name: Build and Deploy Resume

on:
  push:
    branches: [main, core]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install LaTeX packages
        run: |
          tlmgr install \
            geometry \
            hyperref \
            titlesec \
            enumitem \
            parskip \
            xcolor

      - name: Build PDF
        run: pdflatex -interaction=nonstopmode -halt-on-error resume.tex

      - name: Stage site
        run: |
          mkdir -p site
          cp resume.pdf site/justin-hill-resume.pdf

          updated=$(git log -1 --format=%cI -- resume.tex)
          updated_human=$(git log -1 --format=%cd --date=format:'%B %-d, %Y' -- resume.tex)

          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Justin R. Hill — Resume</title>
            <style>
              :root { color-scheme: light dark; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                max-width: 36rem;
                margin: 4rem auto;
                padding: 0 1.5rem;
                line-height: 1.5;
              }
              h1 { margin-bottom: 0.25rem; }
              .meta { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
              a.primary {
                display: inline-block;
                padding: 0.6rem 1rem;
                background: #1F3A5F;
                color: #fff;
                text-decoration: none;
                border-radius: 4px;
              }
              a.primary:hover { background: #2a4d7d; }
            </style>
          </head>
          <body>
            <h1>Justin R. Hill</h1>
            <p class="meta">Resume last updated <time datetime="${updated}">${updated_human}</time></p>
            <p><a class="primary" href="justin-hill-resume.pdf">Download PDF</a></p>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
